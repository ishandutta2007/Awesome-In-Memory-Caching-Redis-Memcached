    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.4; }
    }
    @keyframes pulseLine {
      0% { stroke-dashoffset: 400; opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .particle { animation: floatParticle 6s ease-in-out infinite; }
    .particle-delay1 { animation-delay: 2s; }
    .particle-delay2 { animation-delay: 4s; }

    .pulse-path {
      stroke-dasharray: 200;
      animation: pulseLine 8s linear infinite;
    }

    .rotating-ring {
      transform-origin: 1050px 160px;
      animation: rotateRing 25s linear infinite;
    }
  </style>

