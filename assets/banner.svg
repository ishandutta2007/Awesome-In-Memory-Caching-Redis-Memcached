<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="pinkAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.4; }
    }
    @keyframes pulseLine {
      0% { stroke-dashoffset: 400; opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .particle { animation: floatParticle 6s ease-in-out infinite; }
    .particle-delay1 { animation-delay: 2s; }
    .particle-delay2 { animation-delay: 4s; }

    .pulse-path {
      stroke-dasharray: 200;
      animation: pulseLine 8s linear infinite;
    }

    .rotating-ring {
      transform-origin: 1050px 160px;
      animation: rotateRing 25s linear infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept in back) -->
  <!-- Network Connecting Lines -->
  <g stroke="url(#cyanPurple)" stroke-width="1.5" fill="none" opacity="0.4">
    <path class="pulse-path" d="M 50,280 Q 250,100 450,260 T 850,80 T 1150,240" />
    <path class="pulse-path" d="M 100,40 Q 350,220 600,60 T 1050,280" />
  </g>

  <!-- Floating Glow Orbs (Backdrop) -->
  <circle cx="150" cy="80" r="100" fill="#06b6d4" opacity="0.12" filter="url(#glow)" class="particle" />
  <circle cx="1050" cy="220" r="130" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" class="particle particle-delay1" />
  <circle cx="600" cy="280" r="90" fill="#ec4899" opacity="0.1" filter="url(#glow)" class="particle particle-delay2" />

  <!-- Background Decorative Tech Nodes -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="120" cy="200" r="4" class="particle" />
    <circle cx="280" cy="90" r="3" class="particle particle-delay1" />
    <circle cx="920" cy="250" r="5" class="particle particle-delay2" />
    <circle cx="1080" cy="70" r="3.5" class="particle" />
  </g>

  <!-- Rotating Tech Ring on Far Right -->
  <g class="rotating-ring" opacity="0.25">
    <circle cx="1050" cy="160" r="110" stroke="url(#cyanPurple)" stroke-width="2" stroke-dasharray="12 8 4 8" fill="none" />
    <circle cx="1050" cy="160" r="85" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="20 10" fill="none" />
  </g>

  <!-- FOREGROUND CONTENT & TEXT (Guaranteed top visibility) -->
  
  <!-- Subtle Header Card Container -->
  <rect x="60" y="45" width="1080" height="230" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Directory / Shield Icon Graphic (Left Side) -->
  <g transform="translate(100, 95)">
    <!-- Outer Shield Glow -->
    <path d="M 35 0 L 70 15 V 50 C 70 75 35 95 35 95 C 35 95 0 75 0 50 V 15 Z" fill="url(#cyanPurple)" opacity="0.2" filter="url(#subtleGlow)" />
    <!-- Main Shield Outline -->
    <path d="M 35 5 L 65 18 V 48 C 65 68 35 85 35 85 C 35 85 5 68 5 48 V 18 Z" fill="none" stroke="url(#cyanPurple)" stroke-width="3.5" />
    <!-- Directory Nodes Icon inside Shield -->
    <circle cx="35" cy="32" r="7" fill="#38bdf8" />
    <circle cx="22" cy="58" r="5" fill="#a78bfa" />
    <circle cx="48" cy="58" r="5" fill="#a78bfa" />
    <path d="M 35 39 L 22 53 M 35 39 L 48 53" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Main Title & Subtitles -->
  <!-- Top Badge -->
  <g transform="translate(200, 82)">
    <rect width="210" height="26" rx="13" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
    <text x="105" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">AWESOME DIRECTORY STORE</text>
  </g>

  <!-- Title Line 1 -->
  <text x="200" y="142" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Identity Directory Store Ecosystem 🔑
  </text>

  <!-- Subtitle Line 2 -->
  <text x="200" y="178" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
    Curated SaaS Platforms, LDAP Directory Services &amp; Self-Hosted IAM Solutions
  </text>

  <!-- Category Pills (Bottom Row inside Banner) -->
  <g transform="translate(200, 205)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="28" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="67.5" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ SaaS Platforms</text>

    <!-- Pill 2 -->
    <rect x="147" y="0" width="150" height="28" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="222" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📂 LDAP &amp; Open Source</text>

    <!-- Pill 3 -->
    <rect x="309" y="0" width="145" height="28" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="381.5" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ Zero Trust &amp; IAM</text>
  </g>
</svg>
